"##);
              one(&mut text, "Ok(parse_cfg_output(&text, include_tests))", "Ok(parse_cfg_output(&text))");
              one(&mut text,
                  r##"    Ok(parse_cfg_output(&text))
}

fn cargo_metadata(root: &Path) -> Result<Metadata, String> {
"##,
