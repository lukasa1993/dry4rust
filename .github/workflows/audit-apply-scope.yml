name: Apply cfg scope repair

on:
  push:
    branches: [audit-test-cfg-scope-20260823]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[scope-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: audit-test-cfg-scope-20260823
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt
      - name: Apply repair with native Rust
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/patch.rs" <<'RS'
          use std::fs;

          fn one(text: &mut String, from: &str, to: &str) {
              let count = text.matches(from).count();
              assert_eq!(count, 1, "expected one match, got {count}: {from}");
              *text = text.replacen(from, to, 1);
          }

          fn all(text: &mut String, from: &str, to: &str) {
              let count = text.matches(from).count();
              assert!(count > 0, "expected at least one match: {from}");
              *text = text.replace(from, to);
          }

          fn main() {
              let path = "src/scope.rs";
              let mut text = fs::read_to_string(path).unwrap();
              one(&mut text,
                  r##"    features: HashSet<String>,
    include_tests: bool,
"##,
