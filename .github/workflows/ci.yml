name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stable:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
      - name: Verify lockfile is current
        run: cargo metadata --locked --format-version 1 --no-deps > ${{ runner.temp }}/metadata.json
      - name: Format working tree
        run: cargo fmt --all
      - name: Upload formatted Rust source
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: rustfmt-source
          path: |
            Cargo.toml
            src
          if-no-files-found: error
      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --locked --all-targets --all-features
      - name: Build release
        run: cargo build --locked --release
      - name: Cargo install smoke test
        shell: bash
        run: |
          cargo install --path . --locked --root target/native-install --force
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            target/native-install/bin/dry4rust.exe --version
            target/native-install/bin/dry4rust.exe --help >/dev/null
          else
            target/native-install/bin/dry4rust --version
            target/native-install/bin/dry4rust --help >/dev/null
          fi
      - name: End-to-end explicit feature selection
        if: runner.os == 'Linux'
        shell: bash
        run: |
          fixture="$GITHUB_WORKSPACE/tests/fixtures/feature-crate"
          tool="$GITHUB_WORKSPACE/target/native-install/bin/dry4rust"
          "$tool" --root "$fixture" --min-tokens 10 --fail --json > /tmp/dry-default.json
          grep -q '"groups": 0' /tmp/dry-default.json
          set +e
          "$tool" --root "$fixture" --features extra --min-tokens 10 --fail --json > /tmp/dry-extra.json
          code=$?
          set -e
          cat /tmp/dry-extra.json
          test "$code" -eq 2
          if grep -q '"groups": 0' /tmp/dry-extra.json; then
            echo 'feature-enabled duplicate was not detected' >&2
            exit 1
          fi

  msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust 1.82
        run: rustup toolchain install 1.82.0 --profile minimal
      - name: Check declared MSRV with locked dependencies
        run: cargo +1.82.0 check --locked --all-targets --all-features
