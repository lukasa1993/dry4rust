name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apply-rust-keywords:
    if: github.ref == 'refs/heads/rust-keywords-v202' || github.event.pull_request.head.ref == 'rust-keywords-v202'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: rust-keywords-v202
          fetch-depth: 0
      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
      - name: Apply and verify Rust keyword normalization
        shell: bash
        run: |
          if grep -q '| "gen"' src/lib.rs; then
            echo 'Rust keyword patch is already applied.'
            exit 0
          fi
          mkdir -p target
          rustc tools/patch_rust_keywords.rs -o target/patch-rust-keywords
          target/patch-rust-keywords
          cargo fmt --all
          cargo check --all-targets --all-features
          cargo clippy --locked --all-targets --all-features -- -D warnings
          cargo test --locked --all-targets --all-features
          cargo check --locked --all-targets --all-features
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock src/lib.rs
          git commit -m "Preserve current Rust keywords in DRY normalization"
          git fetch origin rust-keywords-v202
          git rebase origin/rust-keywords-v202
          git push origin HEAD:rust-keywords-v202

  stable:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
      - name: Verify lockfile is current
        run: cargo metadata --locked --format-version 1 --no-deps > ${{ runner.temp }}/metadata.json
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --locked --all-targets --all-features
      - name: Build release
        run: cargo build --locked --release
      - name: Cargo install smoke test
        shell: bash
        run: |
          cargo install --path . --locked --root target/native-install --force
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            target/native-install/bin/dry4rust.exe --version
            target/native-install/bin/dry4rust.exe --help >/dev/null
          else
            target/native-install/bin/dry4rust --version
            target/native-install/bin/dry4rust --help >/dev/null
          fi

  msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust 1.82
        run: rustup toolchain install 1.82.0 --profile minimal
      - name: Check declared MSRV with locked dependencies
        run: cargo +1.82.0 check --locked --all-targets --all-features
