                  "#[derive(Clone, Debug)]\npub(crate) struct CfgContext",
                  "#[derive(Clone, Debug, PartialEq, Eq)]\npub(crate) struct CfgContext");
              one(&mut text,
                  r##"    fn synthetic(include_tests: bool) -> Self {
        Self {
            names: HashSet::new(),
            values: HashMap::new(),
            features: HashSet::new(),
            include_tests,
        }
    }
"##,
                  r##"    fn empty() -> Self {
        Self {
            names: HashSet::new(),
            values: HashMap::new(),
            features: HashSet::new(),
        }
    }
"##);
              one(&mut text,
                  r##"            Meta::Path(path) => {
                if path.is_ident("test") {
                    return self.include_tests;
                }
                path.get_ident()
                    .is_some_and(|name| self.names.contains(&name.to_string()))
            }
"##,
                  r##"            Meta::Path(path) => path
                .get_ident()
                .is_some_and(|name| self.names.contains(&name.to_string())),
"##);
              one(&mut text,
                  r##"            Meta::Path(path) if path.is_ident("test") => self.include_tests,
"##,
                  r##"            Meta::Path(path) if path.is_ident("test") => self.names.contains("test"),
"##);
              one(&mut text,
                  r##"impl CfgContext {
    fn synthetic(include_tests: bool) -> Self {
        Self {
            variants: vec![SingleCfgContext::synthetic(include_tests)],
        }
    }

    pub(crate) fn attrs_active(&self, attrs: &[Attribute]) -> bool {
        self.variants
            .iter()
            .any(|context| context.attrs_active(attrs))
    }
}
"##,
                  r##"impl CfgContext {
    fn from_single(context: SingleCfgContext, include_tests: bool) -> Self {
        Self {
            variants: contexts_for_tests(context, include_tests),
        }
    }

    pub(crate) fn attrs_active(&self, attrs: &[Attribute]) -> bool {
        self.variants
            .iter()
            .any(|context| context.attrs_active(attrs))
    }

    pub(crate) fn single_variants(&self) -> Vec<Self> {
        self.variants
            .iter()
            .cloned()
            .map(|context| Self {
                variants: vec![context],
            })
            .collect()
    }
}

fn contexts_for_tests(context: SingleCfgContext, include_tests: bool) -> Vec<SingleCfgContext> {
    let mut variants = vec![context.clone()];
    if include_tests && !context.names.contains("test") {
        let mut test_context = context;
        test_context.names.insert("test".into());
        variants.push(test_context);
    }
    variants
}
"##);
              one(&mut text,
                  "fn parse_cfg_output(text: &str, include_tests: bool) -> SingleCfgContext {\n    let mut context = SingleCfgContext::synthetic(include_tests);",
                  "fn parse_cfg_output(text: &str) -> SingleCfgContext {\n    let mut context = SingleCfgContext::empty();");
              one(&mut text,
                  r##"fn cargo_cfg(
    root: &Path,
    package: &Package,
    target: &Target,
    include_tests: bool,
