name: Finalize review fixes

on:
  push:
    branches: [scope-correctness-v203]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: scope-correctness-v203
          fetch-depth: 0
      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
      - name: Apply native Rust review fixes
        run: |
          mkdir -p target
          rustc tools/finalize_review.rs -o target/finalize-review
          target/finalize-review
          cargo fmt --all
      - name: Verify final source
        run: |
          cargo metadata --locked --format-version 1 --no-deps > $RUNNER_TEMP/metadata.json
          cargo clippy --locked --all-targets --all-features -- -D warnings
          cargo test --locked --all-targets --all-features
          cargo build --locked --release
          cargo install --path . --locked --root target/native-install --force
          target/native-install/bin/dry4rust --version
          target/native-install/bin/dry4rust --help >/dev/null
      - name: Publish reviewed source and restore strict CI
        shell: bash
        run: |
          git fetch origin main scope-correctness-v203
          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml
          rm tools/finalize_review.rs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/ci.yml src/scope.rs src/scoped_lib.rs tools/finalize_review.rs
          if git diff --cached --quiet; then
            echo "No finalization changes are required."
            exit 0
          fi
          git commit -m "Finish Cargo-aware DRY scope hardening"
          git rebase origin/scope-correctness-v203
          git push origin HEAD:scope-correctness-v203
