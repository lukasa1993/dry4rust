name: Finalize expression include hardening

on:
  push:
    branches: [scope-correctness-v203]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: scope-correctness-v203
          fetch-depth: 0
      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
      - name: Apply Rust-only expression include fix
        shell: bash
        run: |
          mkdir -p target
          rustc tools/finalize_expression_includes.rs -o target/finalize-expression-includes
          target/finalize-expression-includes
          cargo fmt --all
      - name: Verify lockfile
        run: cargo metadata --locked --format-version 1 --no-deps > ${{ runner.temp }}/metadata.json
      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --locked --all-targets --all-features
      - name: Build release
        run: cargo build --locked --release
      - name: Cargo install smoke test
        shell: bash
        run: |
          cargo install --path . --locked --root target/native-install --force
          target/native-install/bin/dry4rust --version
          target/native-install/bin/dry4rust --help >/dev/null
      - name: Commit verified source and restore strict CI
        shell: bash
        run: |
          git fetch origin main scope-correctness-v203
          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml
          rm tools/finalize_expression_includes.rs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/scoped_lib.rs .github/workflows/ci.yml tools/finalize_expression_includes.rs
          git commit -m "Analyze expression-position Rust includes"
          git fetch origin scope-correctness-v203
          git rebase origin/scope-correctness-v203
          git push origin HEAD:scope-correctness-v203
